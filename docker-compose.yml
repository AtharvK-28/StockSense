# One-command local run: `docker compose up --build`, then open http://localhost:4000
# (log in as manager / Demo@1234). Everything runs locally — no hosted services.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stocksense
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/stocksense?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: "4000"
      CLIENT_ORIGIN: http://localhost:4000
      # Served over plain HTTP on localhost, so session cookies can't be marked Secure here.
      COOKIE_SECURE: "false"
      # Optional: email OTPs through any SMTP server (otherwise codes are printed in `docker compose logs app`).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

volumes:
  pgdata:
